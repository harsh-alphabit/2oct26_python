{% extends 'base.html' %}

{% block title %}Sign In - Startup{% endblock %}

{% block page_header %}
<div class="container-fluid bg-primary py-5 bg-header">
    <div class="row py-5">
        <div class="col-12 pt-lg-5 mt-lg-5 text-center">
            <h1 class="display-4 text-white">Sign In</h1>
        </div>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="bg-light rounded p-4 p-md-5">
                <h2>Sign in to your account</h2>
                <form method="post">
                    {% csrf_token %}
                    {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
                    <input type="email" name="email" value="{{ request.POST.email }}" class="form-control mb-3" placeholder="Email" aria-label="Email" required>

                    <input type="password" name="password" class="form-control mb-3" placeholder="Password" aria-label="Password" required>

                    <button type="submit" class="btn btn-dark w-100">Sign In</button>
                </form>
                <p class="mt-3 mb-0">New here? <a href="{% url 'signup' %}" class="text-dark">Create an account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
