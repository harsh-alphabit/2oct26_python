<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Services - Startup</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-white text-dark">
    <div class="container py-5">
        <a href="/" class="text-dark">Home</a>
        <h1 class="my-4">Search services</h1>

        <form method="get" action="{% url 'search' %}" class="input-group mb-4">
            <input type="text" name="q" value="{{ q }}" class="form-control" placeholder="Type search keyword">
            <button type="submit" class="btn btn-dark">Search</button>
        </form>

        {% if q %}
            <p>You searched for: {{ q }}</p>
            {% for service in results %}
                <p>{{ service }}</p>
            {% empty %}
                <p>No matching service found.</p>
            {% endfor %}
        {% else %}
            <p>Enter a service name to search.</p>
        {% endif %}
    </div>
</body>
</html>
